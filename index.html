<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GMIU InfoAssist — Gyanmanjari Innovative University</title>
<meta name="description" content="Official-style AI assistant for Gyanmanjari Innovative University (GMIU), Bhavnagar. Ask about courses, admissions, fees, placements, hostel and more." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0b3d91;
    --brand-2:#1a6fd4;
    --brand-3:#00b4d8;
    --accent:#f5a623;
    --ink:#0f172a;
    --muted:#5b6b82;
    --bg:#e9f0fb;
    --card:rgba(255,255,255,.66);
    --line:rgba(214,226,244,.9);
    --bot-bg:rgba(246,249,254,.9);
    --user-bg:linear-gradient(135deg,#0b3d91 0%,#1a6fd4 55%,#00b4d8 120%);
    --shadow:0 30px 70px -20px rgba(11,61,145,.35), 0 8px 24px -12px rgba(11,61,145,.2);
    --radius:18px;
    --glass-border:rgba(255,255,255,.7);
    --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --spring:cubic-bezier(.2,.9,.3,1.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    padding:18px;min-height:100vh;overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }

  /* ================= AURORA BACKGROUND ================= */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;will-change:transform}
  .blob.b1{width:52vw;height:52vw;left:-12vw;top:-16vw;background:radial-gradient(circle at 30% 30%,#7aa8ff,#4f7fe0 60%,transparent 72%);animation:drift1 22s ease-in-out infinite}
  .blob.b2{width:46vw;height:46vw;right:-14vw;top:-8vw;background:radial-gradient(circle at 60% 40%,#6ee7f0,#22b8d6 60%,transparent 72%);animation:drift2 26s ease-in-out infinite}
  .blob.b3{width:48vw;height:48vw;left:8vw;bottom:-22vw;background:radial-gradient(circle at 40% 60%,#b39dff,#8b6ff0 60%,transparent 72%);animation:drift3 30s ease-in-out infinite}
  .blob.b4{width:38vw;height:38vw;right:2vw;bottom:-16vw;background:radial-gradient(circle at 50% 50%,#ffd08a,#f5a623 60%,transparent 72%);opacity:.42;animation:drift1 24s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vw,4vw) scale(1.12)}66%{transform:translate(-4vw,6vw) scale(.94)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-6vw,5vw) scale(1.1)}66%{transform:translate(3vw,-4vw) scale(.92)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5vw,-6vw) scale(1.15)}}

  /* floating particles */
  .particles{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
  .particle{position:absolute;bottom:-12px;border-radius:50%;background:rgba(255,255,255,.85);
    box-shadow:0 0 8px rgba(120,170,255,.7);animation:floatUp linear infinite}
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
    12%{opacity:.9}
    88%{opacity:.7}
    100%{transform:translateY(-108vh) translateX(var(--dx,20px)) scale(1.1);opacity:0}
  }

  /* ================= POP-UP KEYFRAMES ================= */
  @keyframes popIn{0%{opacity:0;transform:translateY(18px) scale(.9)}60%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:none}}
  @keyframes popDown{0%{opacity:0;transform:translateY(-26px) scale(.95)}60%{opacity:1;transform:translateY(3px) scale(1.01)}100%{opacity:1;transform:none}}
  @keyframes popUp{0%{opacity:0;transform:translateY(24px) scale(.95)}60%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{opacity:1;transform:none}}
  @keyframes popScale{0%{opacity:0;transform:scale(.4) rotate(-14deg)}60%{opacity:1;transform:scale(1.1) rotate(4deg)}100%{opacity:1;transform:none}}
  @keyframes popRight{0%{opacity:0;transform:translateY(16px) translateX(22px) scale(.9)}60%{opacity:1;transform:translateY(-2px) translateX(-2px) scale(1.02)}100%{opacity:1;transform:none}}

  /* ================= APP SHELL ================= */
  .app{
    position:relative;z-index:2;
    width:100%;max-width:1180px;height:min(92vh,880px);
    background:var(--card);
    backdrop-filter:blur(26px) saturate(160%);
    -webkit-backdrop-filter:blur(26px) saturate(160%);
    border-radius:30px;box-shadow:var(--shadow);
    display:flex;flex-direction:row;overflow:hidden;
    border:1px solid var(--glass-border);
    animation:appIn .8s cubic-bezier(.2,.8,.25,1) both;
  }
  @keyframes appIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;position:relative}

  /* ================= SIDEBAR (ChatGPT-style) ================= */
  .sidebar{
    width:268px;flex-shrink:0;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0f1c33 0%,#0a1424 100%);
    color:#c7d2e2;border-right:1px solid rgba(255,255,255,.07);
    overflow:hidden;position:relative;
    transition:width .38s var(--spring),opacity .3s ease,padding .38s var(--spring);
  }
  .sidebar::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 60% at 0% 0%,rgba(26,111,212,.28),transparent 60%);
  }
  @media(min-width:861px){ .sidebar{animation:sbIn .75s var(--spring) both} }
  @keyframes sbIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  .app.sb-collapsed .sidebar{width:0;opacity:0;pointer-events:none;border-right:none}

  .sb-top{display:flex;align-items:center;gap:8px;padding:16px 14px 10px;position:relative;z-index:1}
  .newchat{
    flex:1;display:flex;align-items:center;gap:9px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#eaf1fb;
    font-size:13.5px;font-weight:700;padding:11px 14px;border-radius:12px;
    transition:transform .25s var(--spring),background .25s,border-color .25s,box-shadow .25s;
    animation:popIn .6s .1s var(--spring) both;
  }
  .newchat:hover{background:rgba(122,168,255,.22);border-color:rgba(122,168,255,.5);transform:translateY(-2px) scale(1.02);box-shadow:0 10px 24px -8px rgba(26,111,212,.7)}
  .newchat:active{transform:scale(.96)}
  .newchat .plus{font-size:17px;line-height:1;font-weight:800;display:inline-block;transition:transform .3s var(--spring)}
  .newchat:hover .plus{transform:rotate(90deg) scale(1.15)}
  .sb-collapse{
    width:38px;height:38px;flex-shrink:0;border-radius:11px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#c7d2e2;
    font-size:15px;display:flex;align-items:center;justify-content:center;
    transition:transform .25s var(--spring),background .25s;
    animation:popIn .6s .16s var(--spring) both;
  }
  .sb-collapse:hover{background:rgba(255,255,255,.16);transform:scale(1.08)}

  .sb-label{
    padding:12px 18px 6px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;
    text-transform:uppercase;color:#7d8ea8;position:relative;z-index:1;
    animation:popIn .6s .2s var(--spring) both;
  }
  .sb-list{flex:1;overflow-y:auto;padding:2px 10px 10px;position:relative;z-index:1}
  .sb-list::-webkit-scrollbar{width:7px}
  .sb-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:7px}
  .sb-list::-webkit-scrollbar-track{background:transparent}

  .sb-item{
    position:relative;width:100%;display:flex;align-items:center;gap:9px;cursor:pointer;
    font-family:inherit;text-align:left;background:transparent;border:1px solid transparent;
    color:#c7d2e2;font-size:13px;font-weight:600;padding:10px 11px;border-radius:11px;margin-bottom:3px;
    transition:transform .22s var(--spring),background .22s,color .22s,border-color .22s;
    animation:popIn .5s var(--spring) both;
  }
  .sb-item:hover{background:rgba(255,255,255,.09);color:#fff;transform:translateX(3px) scale(1.012)}
  .sb-item.active{background:linear-gradient(135deg,rgba(26,111,212,.42),rgba(0,180,216,.28));color:#fff;border-color:rgba(122,168,255,.45);box-shadow:0 8px 20px -10px rgba(26,111,212,.9)}
  .sb-item .sb-ico{font-size:13px;flex-shrink:0;opacity:.85}
  .sb-item .sb-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-item .sb-del{
    flex-shrink:0;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:11px;opacity:0;transition:opacity .2s,background .2s,transform .2s var(--spring);
  }
  .sb-item:hover .sb-del{opacity:.7}
  .sb-item .sb-del:hover{opacity:1;background:rgba(255,90,90,.35);transform:scale(1.15)}

  .sb-foot{
    padding:12px 18px 16px;font-size:10.5px;color:#6b7c96;position:relative;z-index:1;
    border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:7px;
    animation:popIn .6s .3s var(--spring) both;
  }
  .sb-foot .sb-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}

  .backdrop{
    position:fixed;inset:0;z-index:55;background:rgba(6,12,24,.55);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  .app.sb-open .backdrop{opacity:1;pointer-events:auto}

  .menu-btn{
    width:40px;height:40px;flex-shrink:0;border-radius:12px;cursor:pointer;font-family:inherit;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;
    font-size:16px;display:flex;align-items:center;justify-content:center;
    transition:transform .25s var(--spring),background .25s;
    animation:popScale .7s .08s var(--spring) both;
  }
  .menu-btn:hover{background:rgba(255,255,255,.3);transform:scale(1.1) rotate(-4deg)}
  .menu-btn:active{transform:scale(.92)}

  /* ================= HEADER ================= */
  header{
    position:relative;overflow:hidden;flex-shrink:0;
    background:linear-gradient(120deg,#0b3d91 0%,#1a6fd4 55%,#00b4d8 130%);
    background-size:200% 200%;
    color:#fff;padding:18px 22px;display:flex;align-items:center;gap:15px;
    animation:popDown .7s var(--spring) both, gradShift 9s ease infinite;
  }
  @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  header::after{
    content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;
    background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);border-radius:50%;
    animation:orbFloat 8s ease-in-out infinite;
  }
  header::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);
    transform:translateX(-120%);animation:sheen 6s ease-in-out infinite;
  }
  @keyframes sheen{0%,60%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
  @keyframes orbFloat{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,16px)}}

  .logo{
    position:relative;width:56px;height:56px;border-radius:16px;background:#fff;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:5px;
    box-shadow:0 8px 22px rgba(0,0,0,.22);
    animation:popScale .8s .12s var(--spring) both, logoGlow 3.4s ease-in-out infinite 1.1s;
    transition:transform .3s var(--spring);
  }
  .logo:hover{transform:scale(1.08) rotate(-3deg)}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;animation:logoBob 4s ease-in-out infinite 1.2s}
  @keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes logoGlow{0%,100%{box-shadow:0 8px 22px rgba(0,0,0,.22),0 0 0 0 rgba(255,255,255,.5)}50%{box-shadow:0 8px 26px rgba(0,0,0,.28),0 0 0 9px rgba(255,255,255,0)}}

  .head-txt{animation:popIn .7s .22s var(--spring) both}
  .head-txt h1{font-size:18px;font-weight:800;letter-spacing:.2px}
  .head-txt p{font-size:12.5px;opacity:.92;margin-top:3px;font-weight:500}

  .status{
    margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
    background:rgba(255,255,255,.18);padding:7px 13px;border-radius:999px;
    border:1px solid rgba(255,255,255,.3);white-space:nowrap;
    backdrop-filter:blur(6px);animation:popIn .7s .32s var(--spring) both;
    transition:transform .3s var(--spring),background .3s;
  }
  .status:hover{transform:scale(1.06);background:rgba(255,255,255,.28)}
  .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.65)}70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

  /* ================= CHAT AREA ================= */
  .chat{
    flex:1;overflow-y:auto;padding:24px 22px 10px;display:flex;flex-direction:column;gap:16px;
    scroll-behavior:smooth;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 6px),transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 6px),transparent 100%);
  }
  .chat::-webkit-scrollbar{width:9px}
  .chat::-webkit-scrollbar-thumb{background:linear-gradient(#b9cdea,#8fb0dd);border-radius:9px}
  .chat::-webkit-scrollbar-track{background:transparent}

  .msg{display:flex;gap:12px;max-width:88%;animation:popIn .55s var(--spring) both}
  .msg.bot{align-self:flex-start}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;animation:popRight .55s var(--spring) both}

  .avatar{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:16px;font-weight:700;overflow:hidden;
    transition:transform .3s var(--spring);
  }
  .avatar:hover{transform:scale(1.12) rotate(-4deg)}
  .msg.bot .avatar{background:#fff;padding:3px;box-shadow:0 6px 16px rgba(11,61,145,.28);animation:avatarFloat 3.6s ease-in-out infinite}
  .msg.bot .avatar img{width:100%;height:100%;object-fit:contain;border-radius:9px;display:block}
  @keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .msg.user .avatar{background:#fff;border:1px solid var(--line);padding:2px;box-shadow:0 6px 16px rgba(11,61,145,.22)}
  .msg.user .avatar img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block;animation:userAvatarPop .6s .12s var(--spring) both}
  @keyframes userAvatarPop{0%{transform:scale(.3) rotate(-12deg);opacity:0}60%{transform:scale(1.12) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}

  .bubble{
    padding:14px 17px;border-radius:18px;font-size:14.5px;line-height:1.65;
    box-shadow:0 4px 14px rgba(15,23,42,.06);word-wrap:break-word;overflow-wrap:anywhere;
    transition:box-shadow .3s ease, transform .3s var(--spring);
  }
  .msg.bot .bubble{background:var(--bot-bg);border:1px solid var(--line);border-top-left-radius:6px;
    backdrop-filter:blur(8px)}
  .msg.user .bubble{background:var(--user-bg);background-size:180% 180%;color:#fff;border-top-right-radius:6px;
    box-shadow:0 8px 22px -6px rgba(11,61,145,.5);animation:userGrad 7s ease infinite}
  @keyframes userGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .bubble:hover{box-shadow:0 12px 30px rgba(15,23,42,.14);transform:translateY(-2px) scale(1.012)}
  .bubble b,.bubble strong{color:var(--brand)}
  .msg.user .bubble b,.msg.user .bubble strong{color:#fff}
  .bubble ul{margin:8px 0 4px 18px}
  .bubble li{margin:4px 0}
  .bubble a{position:relative;color:var(--brand-2);font-weight:700;text-decoration:none;
    background-image:linear-gradient(var(--brand-2),var(--brand-2));background-size:0% 1.5px;
    background-repeat:no-repeat;background-position:0 100%;transition:background-size .35s ease,color .25s ease,transform .25s var(--spring);display:inline-block}
  .bubble a:hover{background-size:100% 1.5px;color:var(--brand);transform:scale(1.05)}
  .bubble .tag{
    display:inline-block;background:linear-gradient(135deg,#e8f0fe,#dbeafe);color:var(--brand);
    font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;margin-bottom:8px;
    letter-spacing:.5px;box-shadow:0 2px 8px rgba(11,61,145,.1);
    animation:popScale .5s .12s var(--spring) both;
  }
  .bubble .src{display:block;margin-top:10px;font-size:11.5px;color:var(--muted);
    border-top:1px dashed var(--line);padding-top:8px;animation:popIn .5s .28s var(--spring) both}
  .bubble .src a{font-size:11.5px}
  .bubble .src a::after{content:" ↗";display:inline-block;transition:transform .3s ease}
  .bubble .src a:hover::after{transform:translate(2px,-2px)}

  /* typing */
  .typing{display:flex;gap:6px;padding:16px 19px;align-items:center}
  .typing span{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7aa8ff,#1a6fd4);
    animation:bounce 1.3s infinite}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0) scale(.85);opacity:.45}30%{transform:translateY(-7px) scale(1.1);opacity:1}}

  /* ================= SUGGESTIONS ================= */
  .suggest{
    padding:8px 22px 14px;display:flex;flex-wrap:wrap;gap:10px;flex-shrink:0;
  }
  .chip{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.85);border:1.5px solid #d5e2f5;color:var(--brand);
    font-family:inherit;font-size:13px;font-weight:700;
    padding:10px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;
    box-shadow:0 3px 10px rgba(11,61,145,.07);
    transition:transform .25s var(--spring),background .25s,color .25s,border-color .25s,box-shadow .25s;
    animation:popIn .6s var(--spring) both;
  }
  .chip:hover{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
    transform:translateY(-4px) scale(1.07);box-shadow:0 12px 26px -6px rgba(11,61,145,.55)}
  .chip:active{transform:translateY(-1px) scale(.95)}

  /* ripple */
  .ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(255,255,255,.55);
    animation:rippleGo .6s ease-out;pointer-events:none}
  .chip .ripple{background:rgba(255,255,255,.6)}
  @keyframes rippleGo{to{transform:scale(3.2);opacity:0}}

  /* ================= COMPOSER ================= */
  .composer{
    padding:14px 18px 18px;border-top:1px solid var(--line);
    background:rgba(251,253,255,.7);backdrop-filter:blur(10px);flex-shrink:0;
    animation:popUp .7s .5s var(--spring) both;
  }
  .input-row{
    display:flex;gap:10px;align-items:flex-end;background:rgba(255,255,255,.92);
    border:1.5px solid #d5e2f5;border-radius:18px;padding:8px 8px 8px 17px;
    transition:border-color .25s,box-shadow .25s,transform .25s var(--spring);
  }
  .input-row:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 5px rgba(26,111,212,.12);transform:translateY(-2px) scale(1.005)}
  textarea{
    flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:14.5px;
    line-height:1.5;max-height:120px;padding:8px 0;color:var(--ink);background:transparent;
  }
  textarea::placeholder{color:#9aa9c0}
  .send{
    position:relative;overflow:hidden;
    width:46px;height:46px;border-radius:14px;border:none;cursor:pointer;flex-shrink:0;
    background:linear-gradient(135deg,var(--brand),var(--brand-2) 60%,var(--brand-3));
    background-size:200% 200%;color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s var(--spring),box-shadow .25s;
    animation:sendGrad 5s ease infinite, popScale .6s .62s var(--spring) both;
  }
  @keyframes sendGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .send:hover{transform:scale(1.12) rotate(5deg);box-shadow:0 12px 28px -6px rgba(11,61,145,.65)}
  .send:active{transform:scale(.9)}
  .send:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .send svg{width:20px;height:20px;transition:transform .3s var(--spring)}
  .send:hover svg{transform:translateX(3px) scale(1.1)}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:10px;animation:popIn .6s .7s var(--spring) both}
  .foot a{color:var(--brand-2);text-decoration:none;font-weight:600}
  .foot a:hover{text-decoration:underline}

  /* ================= QUICK-LINKS BANNER ================= */
  .quickbanner{
    align-self:stretch;margin:2px 0;border-radius:18px;overflow:hidden;
    background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);
    box-shadow:0 10px 30px -10px rgba(11,61,145,.35);backdrop-filter:blur(10px);
    animation:bannerPop .85s .5s var(--spring) both, bannerGlow 4s ease-in-out infinite 1.5s;
    transition:transform .35s var(--spring),box-shadow .35s ease;
  }
  .quickbanner:hover{transform:translateY(-3px) scale(1.015);box-shadow:0 18px 42px -12px rgba(11,61,145,.5)}
  .quickbanner img{width:100%;display:block;animation:bannerBob 5s ease-in-out infinite 1.7s}
  .quickbanner .qb-cap{
    display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:11.5px;font-weight:800;
    color:var(--brand);letter-spacing:.5px;background:linear-gradient(135deg,#eef4ff,#e3edff);
    border-top:1px solid rgba(255,255,255,.75);
  }
  .quickbanner .qb-dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#7aa8ff,#1a6fd4);animation:pulse 2.2s infinite}
  @keyframes bannerPop{0%{opacity:0;transform:translateY(24px) scale(.86)}60%{opacity:1;transform:translateY(-4px) scale(1.03)}100%{opacity:1;transform:none}}
  @keyframes bannerBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes bannerGlow{0%,100%{box-shadow:0 10px 30px -10px rgba(11,61,145,.35),0 0 0 0 rgba(122,168,255,.45)}50%{box-shadow:0 14px 34px -10px rgba(11,61,145,.45),0 0 0 11px rgba(122,168,255,0)}}

  @media(max-width:860px){
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:60;width:282px;
      transform:translateX(-102%);transition:transform .38s var(--spring);
      box-shadow:24px 0 60px -20px rgba(0,0,0,.7);animation:none;
    }
    .app.sb-open .sidebar{transform:translateX(0)}
    .app.sb-collapsed .sidebar{width:282px;opacity:1;pointer-events:auto}
  }
  @media(max-width:640px){

    .status{display:none}
    .logo{width:48px;height:48px}

    .suggest{padding:6px 15px 12px}

  }
  /* instant render (history load) — suppress entrance animations */
  .chat.instant .msg,.chat.instant .quickbanner,.chat.instant .bubble .tag,.chat.instant .bubble .src,

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
</style>

/* =========================================================================
   RETRIEVAL ENGINE — keyword + intent scoring
   ========================================================================= */
const STOP = new Set(["the","a","an","is","are","do","does","i","you","me","my","of","to","for","in","on","at","and","or","what","how","can","tell","about","please","give","want","need","there","it","this","that","with","be","have","has","will","would","should","any","some","get","know","more","info","information","details","detail"]);

function tokenize(s){
  return (s||"").toLowerCase().replace(/[^a-z0-9\s&]/g," ").split(/\s+/).filter(w=>w && !STOP.has(w));
}

function scoreEntry(entry, qRaw, qTokens){
  let score = 0;
  const q = qRaw.toLowerCase();
  // exact phrase / keyword hits (strong)
  for(const k of entry.keys){
    if(q.includes(k)){
      score += k.includes(" ") ? 6 : 4;   // multi-word phrase worth more
    }
  }
  // token overlap with keys
  const keyTokens = new Set();
  entry.keys.forEach(k=>k.split(/\s+/).forEach(t=>keyTokens.add(t)));
  for(const t of qTokens){
    if(keyTokens.has(t)) score += 2;
    else if([...keyTokens].some(k=>k.length>4 && (k.startsWith(t)||t.startsWith(k)))) score += 1;
  }
  // title words
  tokenize(entry.title).forEach(t=>{ if(qTokens.includes(t)) score += 2; });
  return score;
}

function retrieve(query){
  const qTokens = tokenize(query);
  if(!qTokens.length) return null;
  let best=null, bestScore=0;
  for(const e of KB){
    const s = scoreEntry(e, query, qTokens);
    if(s>bestScore){ bestScore=s; best=e; }
  }
  return bestScore>=3 ? {entry:best, score:bestScore} : null;
}

function renderSuggestions(list){
  suggest.innerHTML = "";
  list.forEach((q,i)=>{
    const c = el(`<button class="chip">${q}</button>`);
    c.style.animationDelay = (0.45 + i*0.09) + "s";
    c.onclick = (e)=>{ ripple(e, c); handleUser(q); };
    suggest.appendChild(c);
  });
}

function ripple(e, node){
  const r = node.getBoundingClientRect();
  const size = Math.max(r.width, r.height);
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = size + "px";
  span.style.left = (e.clientX - r.left - size/2) + "px";
  span.style.top  = (e.clientY - r.top  - size/2) + "px";
  node.appendChild(span);
  setTimeout(()=>span.remove(), 620);
}

function answerFor(query){
  const r = retrieve(query);
  if(r){
    const e = r.entry;
    return `${e.a}<span class="src">Source: <a href="${e.src}" target="_blank" rel="noopener">${e.src.replace(/^https?:\/\//,"")}</a></span>`;
  }
  // fallback
  return `<span class="tag">HELP</span>I'm not sure about that one yet. I can help with:<br>
    <ul>
    <li>Courses & programs offered</li>
    <li>Admission process & eligibility</li>
    <li>Fees & scholarships</li>
    <li>Departments / institutes</li>
    <li>Placements & recruiters</li>
    <li>Campus facilities, hostel & transport</li>
    <li>Contact details & academic calendar</li></ul>
    Try rephrasing, or call the admission cell at <b>+91 90999 51160</b>.<br>
    👉 <a href="https://gmiu.edu.in/gmiu/website/" target="_blank" rel="noopener">Visit the official GMIU website</a>`;
}

function handleUser(text){
  const q = (text||"").trim();
  if(!q) return;
  addMsg("user", q.replace(/</g,"&lt;"));
  const c = getActive();
  if(c && (!c.title || c.title === "New chat")){ c.title = titleFrom(q); renderList(); }
  persistActive();
  input.value=""; autoGrow();
  sendBtn.disabled = true;
  const t = showTyping();
  const delay = 420 + Math.min(900, q.length*18);
  setTimeout(()=>{
    t.remove();
    addMsg("bot", answerFor(q));
    persistActive();
    sendBtn.disabled = false;
    input.focus();
  }, delay);
}

function autoGrow(){
  input.style.height="auto";
  input.style.height = Math.min(input.scrollHeight,120)+"px";
}

sendBtn.onclick = (e)=>{ ripple(e, sendBtn); handleUser(input.value); };
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); handleUser(input.value); }
});

/* ---- floating particles ---- */
(function makeParticles(){
  const box = document.getElementById("particles");
  const n = window.innerWidth < 640 ? 14 : 26;
  for(let i=0;i<n;i++){
    const p = document.createElement("span");
    p.className = "particle";
    const size = 3 + Math.random()*6;
    p.style.width = p.style.height = size + "px";
    p.style.left = Math.random()*100 + "vw";
    p.style.setProperty("--dx", (Math.random()*80-40) + "px");
    p.style.animationDuration = (11 + Math.random()*14) + "s";
    p.style.animationDelay = (-Math.random()*20) + "s";
    p.style.opacity = 0.25 + Math.random()*0.5;
    box.appendChild(p);
  }
})();

/* =========================================================================
   CHAT HISTORY (localStorage) — ChatGPT-style sidebar
   ========================================================================= */
const LS_KEY = "gmiu_infoassist_chats_v1";
let chats = [];
let activeId = null;

function uid(){ return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadStore(){
  try{ const raw = localStorage.getItem(LS_KEY); chats = raw ? JSON.parse(raw) : []; }
  catch(e){ chats = []; }
  if(!Array.isArray(chats)) chats = [];
}
function saveStore(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(chats)); }catch(e){} }
function getActive(){ return chats.find(c=>c.id===activeId) || null; }

function titleFrom(text){
  let t = (text||"").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
  if(!t) t = "New chat";
  return t.length > 34 ? t.slice(0,34).trim() + "…" : t;
}

function renderList(){
  chatListEl.innerHTML = "";
  if(!chats.length){
    chatListEl.appendChild(el(`<div style="padding:14px 12px;font-size:12px;color:#6b7c96;line-height:1.6">No chats yet.<br>Start a new chat to see it here.</div>`));
    return;
  }
  chats.forEach((c,i)=>{
    const item = el(`<button class="sb-item${c.id===activeId?" active":""}">
        <span class="sb-ico">💬</span>
        <span class="sb-title"></span>
        <span class="sb-del" title="Delete chat">✕</span>
      </button>`);
    item.querySelector(".sb-title").textContent = c.title || "New chat";
    item.style.animationDelay = (0.05 + Math.min(i,10)*0.04) + "s";
    item.onclick = (e)=>{
      if(e.target.classList.contains("sb-del")){ e.stopPropagation(); deleteChat(c.id); return; }
      openChat(c.id);
    };
    chatListEl.appendChild(item);
  });
}

function persistActive(){
  const c = getActive();
  if(!c) return;
  c.msgs = [];
  chat.querySelectorAll(".msg").forEach(m=>{
    const role = m.classList.contains("user") ? "user" : "bot";
    const b = m.querySelector(".bubble");
    if(b) c.msgs.push({role, html:b.innerHTML});
  });
  saveStore();
}

function renderThread(c, animate){
  chat.innerHTML = "";
  if(animate === false) chat.classList.add("instant");
  c.msgs.forEach(m=>addMsg(m.role, m.html, {animate:animate, scroll:false}));
  if(animate === false) chat.classList.remove("instant");
  smoothScroll();
}

function newChat(){
  persistActive();
  const c = {id:uid(), title:"New chat", ts:Date.now(), msgs:[]};
  chats.unshift(c);
  activeId = c.id;
  saveStore();
  renderList();
  chat.innerHTML = "";
  renderWelcome(true);
  closeSidebarMobile();
  input.focus();
}

function openChat(id){
  if(id === activeId){ closeSidebarMobile(); return; }
  persistActive();
  activeId = id;
  const c = getActive();
  if(!c) return;
  renderList();
  renderThread(c, true);
  closeSidebarMobile();
}

function deleteChat(id){
  chats = chats.filter(c=>c.id!==id);
  if(activeId === id){
    if(chats.length){ activeId = chats[0].id; saveStore(); renderList(); renderThread(getActive(), true); }
    else { activeId = null; saveStore(); renderList(); chat.innerHTML = ""; renderWelcome(true); }
  } else { saveStore(); renderList(); }
}

function isMobile(){ return window.matchMedia("(max-width:860px)").matches; }
function closeSidebarMobile(){ app.classList.remove("sb-open"); }
function toggleSidebar(){ if(isMobile()) app.classList.toggle("sb-open"); else app.classList.toggle("sb-collapsed"); }

newChatBtn.onclick = (e)=>{ ripple(e, newChatBtn); newChat(); };
collapseBtn.onclick = ()=>{ app.classList.add("sb-collapsed"); };
menuBtn.onclick = ()=>{ toggleSidebar(); };
backdrop.onclick = ()=>{ closeSidebarMobile(); };
window.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSidebarMobile(); });

/* ---- boot ---- */
loadStore();
if(chats.length){
  activeId = chats[0].id;
  renderList();
  renderThread(getActive(), false);
} else {
  const c = {id:uid(), title:"New chat", ts:Date.now(), msgs:[]};
  chats.unshift(c); activeId = c.id; saveStore();
  renderList();
  renderWelcome(true);
}
renderSuggestions(STARTERS);
input.focus();
</script>
